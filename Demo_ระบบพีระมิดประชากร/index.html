<!DOCTYPE html>
<html lang="th">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO — ระบบพีระมิดประชากร (Pro-Health Data BKK South)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="./mock-backend.js"></script>
    <script>
        Babel.registerPreset("custom-react", {
            presets: [
                [Babel.availablePresets["react"], { runtime: "classic" }]
            ]
        });
    </script>

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
        }

        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                background: white;
                margin: 0;
            }

            .print-full-width {
                width: 100% !important;
                max-width: none !important;
                border: none !important;
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            @page {
                size: A4 portrait;
                margin: 10mm;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel" data-presets="custom-react">
        const { useState, useEffect, useMemo, useRef } = React;

        const CONST_DISEASES = ['เบาหวาน', 'ความดัน', 'หัวใจ', 'ไขมัน', 'หลอดเลือดสมอง'];
        const CONST_RISKS = ['เบาหวาน', 'ความดัน', 'โรคเก๊าท์', 'ไตวายเรื้อรัง', 'หัวใจ', 'เส้นเลือดสมอง', 'ถุงลมโป่งพอง', 'ไขมันในเลือด', 'โรคอ้วน', 'พฤติกรรม', 'มะเร็ง', 'โลหิตจาง', 'เส้นเลือดหัวใจและหลอดเลือด', 'โรคเครียด'];
        const WATTHANA_COMMUNITIES = [
            "1.ไม่กำหนดชุมชน", "2.เฉลิมอนุสรณ์", "3.รื่นฤดี", "4.สุเหร่าบ้านดอน", "5.แจ่มจันทร์",
            "6.คลองเป้ง(ลีลานุช)", "7.หลัง สน.ทองหล่อ", "8.นวลจิตร", "9.ชวาลา", "10.ข้างสะพานคลองตัน",
            "11.เกษมสำราญ", "12.พัฒนาบ้านสามอิน", "13.ศาลาลอย", "14.หมู่บ้านพิบูลเวศม์",
            "15.มีสุวรรณ 2", "16.มีสุวรรณ 3", "17.สุเหร่าบางมะเขือ"
        ];

        function App() {
            const [authRole, setAuthRole] = useState(null);
            const [adminPasswordInput, setAdminPasswordInput] = useState('');
            const [showAdminInput, setShowAdminInput] = useState(false);
            const [authError, setAuthError] = useState('');

            const [currentMenu, setCurrentMenu] = useState('health');
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);

            const currentYearTH = useMemo(() => new Date().getFullYear() + 543, []);
            const [projectionYear, setProjectionYear] = useState(currentYearTH);

            const [healthData, setHealthData] = useState([]);
            const [isLoadingHealth, setIsLoadingHealth] = useState(false);

            const [areaPop, setAreaPop] = useState({});
            const [areaNotes, setAreaNotes] = useState({});
            const [isLoadingArea, setIsLoadingArea] = useState(false);

            const [watthanaData, setWatthanaData] = useState({});
            const [isLoadingWatthana, setIsLoadingWatthana] = useState(false);

            const [ltcHhcData, setLtcHhcData] = useState([]);
            const [isLoadingLtcHhc, setIsLoadingLtcHhc] = useState(false);

            const [availableYears, setAvailableYears] = useState([]);
            const [availableCommunities, setAvailableCommunities] = useState([]);
            const [availableAddressTypes, setAvailableAddressTypes] = useState([]);

            const [filters, setFilters] = useState({
                year: 'all', communities: [], addressType: 'all', diseases: [], risks: []
            });

            const [pyramidConfig, setPyramidConfig] = useState({
                group5Years: false, group10Years: false, groupLifeStage: false, hideEmpty: false, combineGenders: false
            });

            useEffect(() => {
                if (authRole) {
                    fetchHealthData();
                    fetchAreaAndWatthanaData();
                    fetchLtcHhcData();
                }
            }, [authRole]);

            const fetchHealthData = () => {
                setIsLoadingHealth(true);
                window.DemoBackend.getHealthData()
                    .then((data) => {
                        setHealthData(data);
                        setAvailableYears([...new Set(data.map(d => d.year).filter(Boolean))].sort((a, b) => b - a));
                        setAvailableCommunities([...new Set(data.map(d => d.community).filter(Boolean))].sort());
                        setAvailableAddressTypes([...new Set(data.map(d => d.addressType).filter(Boolean))].sort());
                        setIsLoadingHealth(false);
                    })
                    .catch((err) => { console.error(err); setIsLoadingHealth(false); });
            };

            const fetchAreaAndWatthanaData = () => {
                setIsLoadingArea(true);
                setIsLoadingWatthana(true);
                window.DemoBackend.getAreaData()
                    .then((data) => {
                        setAreaPop(data.population || {});
                        setAreaNotes(data.notes || {});
                        setIsLoadingArea(false);
                    })
                    .catch((err) => { console.error(err); setIsLoadingArea(false); });

                window.DemoBackend.getWatthanaData()
                    .then((data) => {
                        setWatthanaData(data);
                        setIsLoadingWatthana(false);
                    })
                    .catch((err) => { console.error(err); setIsLoadingWatthana(false); });
            };

            const fetchLtcHhcData = () => {
                setIsLoadingLtcHhc(true);
                window.DemoBackend.getLtcHhcData()
                    .then((data) => {
                        setLtcHhcData(data);
                        setIsLoadingLtcHhc(false);
                    })
                    .catch((err) => {
                        console.error("Error fetching LTC-HHC data:", err);
                        setIsLoadingLtcHhc(false);
                    });
            };

            const handleResetDemo = () => {
                if (!window.confirm("รีเซ็ตข้อมูลจำลองทั้งหมดกลับเป็นค่าเริ่มต้นใช่หรือไม่?")) return;
                window.DemoBackend.resetDemoData();
                fetchAreaAndWatthanaData();
                alert("รีเซ็ตข้อมูลจำลองเรียบร้อยแล้ว");
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPasswordInput.trim() === window.DemoBackend.DEMO_ADMIN_PASS) {
                    setAuthError('');
                    setAdminPasswordInput('');
                    setShowAdminInput(false);
                    setAuthRole('admin');
                } else {
                    setAuthError(`รหัสผ่านไม่ถูกต้อง (สำหรับ Demo ให้ใช้: ${window.DemoBackend.DEMO_ADMIN_PASS})`);
                }
            };

            const parseAge = (ageStr) => {
                if (ageStr === '<1') return 0;
                const num = parseInt(ageStr, 10);
                return isNaN(num) ? -1 : num;
            };

            if (!authRole) {
                return (
                    <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full text-center">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold mb-5 border border-amber-200">
                                <i className="fa-solid fa-flask"></i> DEMO MOCK-UP (Synthetic Data)
                            </div>
                            <div className="bg-blue-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5">
                                <i className="fa-solid fa-users text-4xl text-blue-600"></i>
                            </div>
                            <h1 className="text-2xl font-bold text-gray-800 mb-1">ระบบพีระมิดประชากร</h1>
                            <p className="text-xs font-semibold text-blue-600 mb-3">Pro-Health Data BKK South</p>
                            <p className="text-gray-500 text-sm mb-6">กรุณาเลือกรูปแบบการเข้าสู่ระบบจำลองสำหรับ UX Audit</p>

                            <div className="space-y-3">
                                <button
                                    onClick={() => setAuthRole('guest')}
                                    className="w-full py-3 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-lg font-medium transition-colors border border-gray-300"
                                >
                                    เข้าสู่ระบบ ผู้เยี่ยมชม (Guest)
                                </button>

                                {!showAdminInput ? (
                                    <button
                                        onClick={() => setShowAdminInput(true)}
                                        className="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors shadow-md"
                                    >
                                        เข้าสู่ระบบ ผู้ดูแลระบบ (Admin)
                                    </button>
                                ) : (
                                    <form onSubmit={handleAdminLogin} className="p-4 bg-blue-50 border border-blue-200 rounded-lg text-left space-y-3">
                                        <label className="block text-xs font-bold text-blue-900">รหัสผ่านผู้ดูแลระบบ (Mock Demo Credential)</label>
                                        <input
                                            type="password"
                                            value={adminPasswordInput}
                                            onChange={(e) => setAdminPasswordInput(e.target.value)}
                                            placeholder={`กรอก ${window.DemoBackend.DEMO_ADMIN_PASS}`}
                                            className="w-full border border-blue-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            autoFocus
                                        />
                                        {authError && <p className="text-xs text-red-600 font-medium">{authError}</p>}
                                        <div className="flex gap-2">
                                            <button type="submit" className="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold">ยืนยัน</button>
                                            <button type="button" onClick={() => setAdminPasswordInput(window.DemoBackend.DEMO_ADMIN_PASS)} className="px-3 py-2 bg-white border border-blue-300 text-blue-700 hover:bg-blue-100 rounded-lg text-xs font-semibold">เติมรหัส Demo</button>
                                            <button type="button" onClick={() => { setShowAdminInput(false); setAuthError(''); }} className="px-3 py-2 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg text-xs font-semibold">ยกเลิก</button>
                                        </div>
                                    </form>
                                )}
                            </div>

                            <div className="mt-6 p-3 bg-gray-50 border rounded-lg text-left text-xs text-gray-600 space-y-1">
                                <p className="font-bold text-gray-700"><i className="fa-solid fa-circle-info text-blue-500 mr-1"></i> บัญชีทดสอบระบบ Demo:</p>
                                <p>• <strong>ผู้เยี่ยมชม:</strong> กดเข้าใช้งานได้ทันที (ดูรายงานและกรองข้อมูลทุกมิติ)</p>
                                <p>• <strong>ผู้ดูแลระบบ (Mock):</strong> รหัสผ่าน <code className="bg-gray-200 px-1.5 py-0.5 rounded font-mono text-gray-800">demo-admin</code></p>
                                <p className="text-[11px] text-amber-700 pt-1">* หมายเหตุ: เป็นรหัสจำลองสำหรับ Demo เท่านั้น ไม่ใช่รหัสผ่านระบบจริง</p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen bg-gray-50 font-sans overflow-hidden">
                    <aside className={`${isSidebarOpen ? 'w-64' : 'w-0 -translate-x-full'} lg:translate-x-0 lg:w-64 bg-white border-r shadow-sm transition-all duration-300 flex flex-col fixed lg:static h-full z-20 print:hidden`}>
                        <div className="p-4 border-b flex justify-between items-center bg-blue-600 text-white">
                            <div>
                                <h2 className="font-bold text-lg whitespace-nowrap overflow-hidden">ประชากร Data Center</h2>
                                <span className="text-[10px] uppercase tracking-wider bg-amber-400 text-amber-950 font-bold px-1.5 py-0.5 rounded">Demo Mode</span>
                            </div>
                            <button onClick={() => setIsSidebarOpen(false)} className="lg:hidden text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <div className="p-4 flex flex-col gap-2 flex-grow overflow-y-auto">
                            <SidebarBtn active={currentMenu === 'health'} icon="fa-solid fa-filter" text="ข้อมูลคัดกรองสุขภาพ" onClick={() => setCurrentMenu('health')} />
                            <SidebarBtn active={currentMenu === 'area'} icon="fa-solid fa-building-user" text="ประชากรพื้นที่รับผิดชอบ" onClick={() => setCurrentMenu('area')} />
                            <SidebarBtn active={currentMenu === 'watthana'} icon="fa-solid fa-city" text="สถิติประชากรเขตวัฒนา" onClick={() => setCurrentMenu('watthana')} />
                            <SidebarBtn active={currentMenu === 'ltc-hhc'} icon="fa-solid fa-house-medical" text="LTC-HHC" onClick={() => setCurrentMenu('ltc-hhc')} />
                            {authRole === 'admin' && <SidebarBtn active={currentMenu === 'manage'} icon="fa-solid fa-gear" text="จัดการข้อมูล (Admin)" onClick={() => setCurrentMenu('manage')} />}
                        </div>
                        <div className="p-4 border-t space-y-2">
                            <div className="flex items-center gap-3 mb-2 text-sm text-gray-600">
                                <div className="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center"><i className="fa-solid fa-user"></i></div>
                                <div>
                                    <p className="font-semibold text-gray-800">{authRole === 'admin' ? 'ผู้ดูแลระบบ (Mock)' : 'ผู้เยี่ยมชม (Mock)'}</p>
                                </div>
                            </div>
                            <button onClick={handleResetDemo} className="w-full py-2 flex items-center justify-center gap-2 text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-lg text-xs font-semibold transition-colors">
                                <i className="fa-solid fa-rotate-left"></i> รีเซ็ตข้อมูลจำลอง
                            </button>
                            <button onClick={() => { setAuthRole(null); setCurrentMenu('health'); }} className="w-full py-2 flex items-center justify-center gap-2 text-red-600 hover:bg-red-50 rounded-lg text-sm transition-colors">
                                <i className="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative w-full">
                        <header className="bg-white border-b p-4 flex items-center justify-between lg:hidden print:hidden">
                            <button onClick={() => setIsSidebarOpen(true)} className="text-gray-600"><i className="fa-solid fa-bars text-xl"></i></button>
                            <span className="font-bold text-gray-800">ประชากร Data Center (Demo)</span>
                            <div className="w-6"></div>
                        </header>

                        <div className="bg-amber-50 border-b border-amber-200 px-4 py-2 text-xs text-amber-900 flex flex-wrap items-center justify-between gap-2 print:hidden">
                            <div className="flex items-center gap-2">
                                <span className="bg-amber-200 text-amber-950 font-bold px-2 py-0.5 rounded">DEMO MOCK-UP</span>
                                <span>กำลังแสดงผลด้วยชุดข้อมูลสังเคราะห์ (Synthetic Seed Data) — การแก้ไขในโหมด Admin จะบันทึกเฉพาะในเบราว์เซอร์ (localStorage)</span>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 md:p-6 print:p-0">
                            {currentMenu === 'health' && (
                                <HealthScreeningView data={healthData} isLoading={isLoadingHealth} availableYears={availableYears} availableCommunities={availableCommunities} availableAddressTypes={availableAddressTypes} filters={filters} setFilters={setFilters} pyramidConfig={pyramidConfig} setPyramidConfig={setPyramidConfig} parseAge={parseAge} currentYearTH={currentYearTH} projectionYear={projectionYear} setProjectionYear={setProjectionYear} />
                            )}
                            {currentMenu === 'area' && (
                                <AreaPopulationView areaPop={areaPop} areaNotes={areaNotes} isLoading={isLoadingArea} pyramidConfig={pyramidConfig} setPyramidConfig={setPyramidConfig} currentYearTH={currentYearTH} projectionYear={projectionYear} setProjectionYear={setProjectionYear} />
                            )}
                            {currentMenu === 'watthana' && (
                                <WatthanaPopulationView watthanaData={watthanaData} isLoading={isLoadingWatthana} pyramidConfig={pyramidConfig} setPyramidConfig={setPyramidConfig} currentYearTH={currentYearTH} projectionYear={projectionYear} setProjectionYear={setProjectionYear} />
                            )}
                            {currentMenu === 'ltc-hhc' && (
                                <LtcHhcView data={ltcHhcData} isLoading={isLoadingLtcHhc} pyramidConfig={pyramidConfig} setPyramidConfig={setPyramidConfig} currentYearTH={currentYearTH} projectionYear={projectionYear} setProjectionYear={setProjectionYear} />
                            )}
                            {currentMenu === 'manage' && authRole === 'admin' && (
                                <DataManagementView areaPop={areaPop} areaNotes={areaNotes} watthanaData={watthanaData} refreshData={fetchAreaAndWatthanaData} currentYearTH={currentYearTH} />
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const SidebarBtn = ({ active, icon, text, onClick }) => (
            <button onClick={onClick} className={`flex items-center gap-3 w-full p-3 rounded-lg text-left text-sm font-medium transition-colors ${active ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                <i className={`${icon} w-5 text-center`}></i>{text}
            </button>
        );

        const MultiSelect = ({ options, selected, onChange, placeholder, disabled }) => {
            const [isOpen, setIsOpen] = useState(false);
            const containerRef = useRef(null);
            useEffect(() => {
                const handleClickOutside = (e) => { if (containerRef.current && !containerRef.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);
            const toggleOption = (opt) => {
                if (selected.includes(opt)) onChange(selected.filter(i => i !== opt));
                else onChange([...selected, opt]);
            };
            return (
                <div className="relative" ref={containerRef}>
                    <div className={`min-h-[42px] border rounded-lg px-3 py-2 flex items-center justify-between text-sm transition-colors ${disabled ? 'bg-gray-100 border-gray-200 cursor-not-allowed opacity-70' : 'bg-white border-gray-300 cursor-pointer hover:border-blue-400'}`} onClick={() => !disabled && setIsOpen(!isOpen)}>
                        <div className="flex flex-wrap gap-1 items-center overflow-hidden">
                            {selected.length === 0 ? <span className={disabled ? "text-gray-500" : "text-gray-400"}>{disabled ? "ถูกระงับการเลือก" : placeholder}</span> :
                                selected.length > 2 ? <span className="text-gray-700">เลือกแล้ว {selected.length} รายการ</span> :
                                    selected.map(s => <span key={s} className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">{s}</span>)
                            }
                        </div>
                        <i className={`fa-solid fa-chevron-down ml-2 text-xs ${disabled ? 'text-gray-300' : 'text-gray-400'}`}></i>
                    </div>
                    {isOpen && !disabled && (
                        <div className="absolute z-30 top-full left-0 w-64 mt-1 bg-white border rounded-lg shadow-xl max-h-60 overflow-y-auto">
                            <div className="p-2 hover:bg-gray-50 cursor-pointer border-b text-sm text-blue-600 font-medium" onClick={() => onChange([])}>ล้างการเลือกทั้งหมด</div>
                            {options.map(opt => (
                                <label key={opt} className="flex items-center px-3 py-2 hover:bg-gray-50 cursor-pointer text-sm">
                                    <input type="checkbox" className="mr-2 h-4 w-4 text-blue-600 rounded border-gray-300" checked={selected.includes(opt)} onChange={() => toggleOption(opt)} />
                                    <span className="truncate">{opt}</span>
                                </label>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // --- View 1: Health Screening ---
        const HealthScreeningView = ({ data, isLoading, availableYears, availableCommunities, availableAddressTypes, filters, setFilters, pyramidConfig, setPyramidConfig, parseAge, currentYearTH, projectionYear, setProjectionYear }) => {
            const baseTitle = "พีระมิดประชากรจากการคัดกรองสุขภาพ";

            const printTitle = useMemo(() => {
                let details = [];
                details.push(filters.year !== 'all' ? `ปีงบประมาณ ${filters.year}` : 'รวมทุกปีงบประมาณ');
                if (filters.communities.length > 0) details.push(`ชุมชน: ${filters.communities.join(', ')}`);
                if (filters.addressType !== 'all') details.push(`ที่อยู่: ${filters.addressType}`);
                if (filters.diseases.length > 0) details.push(`โรค: ${filters.diseases.join(', ')}`);
                if (filters.risks.length > 0) details.push(`เสี่ยง: ${filters.risks.join(', ')}`);
                return `${baseTitle} (${details.join(' | ')})`;
            }, [filters]);

            const chartData = useMemo(() => {
                if (!data || data.length === 0) return [];
                let filtered = data.filter(row => {
                    if (filters.year !== 'all' && row.year !== filters.year) return false;
                    if (filters.addressType !== 'all' && row.addressType !== filters.addressType) return false;
                    if (filters.communities.length > 0 && !filters.communities.includes(row.community)) return false;

                    if (filters.diseases.length > 0) {
                        const hasGeneralDisease = (val) => ["รับการรักษาอยู่", "รับการรักษาไม่สม่ำเสมอ", "เคยรักษา / กินยาเอง"].includes(val?.trim());
                        const strokeKeywords = ["หลอดเลือดสมอง", "โรคหลอดเลือดสมอง", "เส้นเลือดสมองตีบ", "เส้นเลือดในสมองอักเสบ"];
                        const hasStroke = strokeKeywords.some(kw => row.stroke?.includes(kw));

                        const hasDM = hasGeneralDisease(row.dm);
                        const hasHT = hasGeneralDisease(row.ht);
                        const hasHeart = hasGeneralDisease(row.heart);
                        const hasLipid = hasGeneralDisease(row.lipid);

                        const isMatch = filters.diseases.every(disease => {
                            if (disease === 'เบาหวาน') return hasDM;
                            if (disease === 'ความดัน') return hasHT;
                            if (disease === 'หัวใจ') return hasHeart;
                            if (disease === 'ไขมัน') return hasLipid;
                            if (disease === 'หลอดเลือดสมอง') return hasStroke;
                            return false;
                        });
                        if (!isMatch) return false;
                    }

                    if (filters.risks.length > 0) {
                        if (!row.risks) return false;
                        const rowRisks = row.risks.split(',').map(r => r.trim());
                        const isMatch = filters.risks.every(risk => rowRisks.includes(risk));
                        if (!isMatch) return false;
                    }
                    return true;
                });
                const ageShift = projectionYear - currentYearTH;
                return processPyramidData(filtered, pyramidConfig, parseAge, ageShift);
            }, [data, filters, pyramidConfig, projectionYear, currentYearTH]);

            return (
                <div className="bg-white rounded-xl shadow-sm border p-4 lg:p-6 print-full-width">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-4 gap-4 print:hidden">
                        <div><h2 className="text-xl font-bold text-gray-800">{baseTitle}</h2><p className="text-sm text-gray-500">อ้างอิงจากฐานข้อมูลคัดกรองสุขภาพ (Demo Seed: {data.length.toLocaleString()} รายการ)</p></div>
                        <button onClick={() => window.print()} className="flex items-center gap-2 bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 text-sm"><i className="fa-solid fa-print"></i> พิมพ์รายงาน</button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-6 print:hidden bg-blue-50/50 p-4 rounded-lg border border-blue-100">
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">ปีงบประมาณ</label>
                            <select className="w-full border rounded-lg px-3 py-2 bg-white text-sm focus:outline-none focus:border-blue-500" value={filters.year} onChange={e => setFilters({ ...filters, year: e.target.value })}>
                                <option value="all">แสดงทั้งหมด</option>{availableYears.map(y => <option key={y} value={y}>{y}</option>)}
                            </select>
                        </div>
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">ชุมชน</label><MultiSelect options={availableCommunities} selected={filters.communities} onChange={val => setFilters({ ...filters, communities: val })} placeholder="เลือกทั้งหมด" disabled={false} /></div>
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">ประเภทที่อยู่</label>
                            <select className="w-full border rounded-lg px-3 py-2 bg-white text-sm focus:outline-none focus:border-blue-500" value={filters.addressType} onChange={e => setFilters({ ...filters, addressType: e.target.value })}>
                                <option value="all">แสดงทั้งหมด</option>{availableAddressTypes.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                        </div>
                        <div><label className={`block text-xs font-semibold mb-1 ${filters.risks.length > 0 ? 'text-gray-400' : 'text-red-600'}`}><i className="fa-solid fa-notes-medical"></i> โรคประจำตัว</label>
                            <MultiSelect options={CONST_DISEASES} selected={filters.diseases} onChange={val => setFilters({ ...filters, diseases: val })} placeholder="เลือกทั้งหมด" disabled={filters.risks.length > 0} />
                        </div>
                        <div><label className={`block text-xs font-semibold mb-1 ${filters.diseases.length > 0 ? 'text-gray-400' : 'text-orange-600'}`}><i className="fa-solid fa-triangle-exclamation"></i> ความเสี่ยง</label>
                            <MultiSelect options={CONST_RISKS} selected={filters.risks} onChange={val => setFilters({ ...filters, risks: val })} placeholder="เลือกทั้งหมด" disabled={filters.diseases.length > 0} />
                        </div>
                    </div>

                    {isLoading ? (<div className="h-96 flex flex-col items-center justify-center text-gray-500 print:hidden"><i className="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-4"></i></div>) : (
                        <PyramidDisplay chartData={chartData} pyramidConfig={pyramidConfig} setPyramidConfig={setPyramidConfig} title={printTitle} currentYearTH={currentYearTH} projectionYear={projectionYear} setProjectionYear={setProjectionYear} />
                    )}
                </div>
            );
        };

        // --- View 2: Area Population ---
        const AreaPopulationView = ({ areaPop, areaNotes, isLoading, pyramidConfig, setPyramidConfig, currentYearTH, projectionYear, setProjectionYear }) => {
            const [selectedZone, setSelectedZone] = useState('zone1');
            const availableAreaYears = useMemo(() => Object.keys(areaPop).sort((a, b) => b - a), [areaPop]);
            const [selectedViewYear, setSelectedViewYear] = useState('');

            useEffect(() => { if (availableAreaYears.length > 0 && !availableAreaYears.includes(selectedViewYear)) setSelectedViewYear(availableAreaYears[0]); }, [availableAreaYears, selectedViewYear]);

            const zones = [{ id: 'zone1', name: 'เขตที่ 1 พระโขนงเหนือ' }, { id: 'zone2', name: 'เขตที่ 2 คลองตันเหนือ' }, { id: 'zone3', name: 'เขตที่ 3 คลองเตยเหนือ' }, { id: 'all', name: 'รวมทุกเขต' }];

            let title = "พีระมิดประชากรข้อมูลประชากรเขตพื้นที่รับผิดชอบ";
            if (selectedZone === 'all') title += " (รวมทุกเขต)";
            else title += ` (${zones.find(z => z.id === selectedZone)?.name || ''})`;
            if (selectedViewYear) title += ` (ปี ${selectedViewYear})`;

            const displayNotes = useMemo(() => {
                if (!selectedViewYear || !areaNotes[selectedViewYear]) return [];
                let notes = [];
                if (selectedZone === 'all') {
                    ['zone1', 'zone2', 'zone3'].forEach(z => {
                        if (areaNotes[selectedViewYear][z]) notes.push(`[${zones.find(x => x.id === z).name}] ${areaNotes[selectedViewYear][z]}`);
                    });
                } else {
                    if (areaNotes[selectedViewYear][selectedZone]) notes.push(areaNotes[selectedViewYear][selectedZone]);
                }
                return notes;
            }, [selectedViewYear, selectedZone, areaNotes]);

            const chartData = useMemo(() => {
                if (!selectedViewYear || !areaPop[selectedViewYear]) return [];
                let rawData = [];
                const yearData = areaPop[selectedViewYear];

                if (selectedZone === 'all') {
                    const agg = {};
                    ['zone1', 'zone2', 'zone3'].forEach(z => {
                        Object.keys(yearData[z] || {}).forEach(ageStr => {
                            if (!agg[ageStr]) agg[ageStr] = { male: 0, female: 0 };
                            agg[ageStr].male += parseInt(yearData[z][ageStr].male || 0);
                            agg[ageStr].female += parseInt(yearData[z][ageStr].female || 0);
                        });
                    });
                    Object.keys(agg).forEach(ageStr => {
                        for (let i = 0; i < agg[ageStr].male; i++) rawData.push({ age: ageStr, gender: 'ชาย' });
                        for (let i = 0; i < agg[ageStr].female; i++) rawData.push({ age: ageStr, gender: 'หญิง' });
                    });
                } else {
                    const zoneDb = yearData[selectedZone] || {};
                    Object.keys(zoneDb).forEach(ageStr => {
                        const m = parseInt(zoneDb[ageStr].male || 0);
                        const f = parseInt(zoneDb[ageStr].female || 0);
                        for (let i = 0; i < m; i++) rawData.push({ age: ageStr, gender: 'ชาย' });
                        for (let i = 0; i < f; i++) rawData.push({ age: ageStr, gender: 'หญิง' });
                    });
                }
                const parseAge = (str) => { if (str === '<1') return 0; return parseInt(str); };
                const baseYear = parseInt(selectedViewYear) || currentYearTH;
                const ageShift = projectionYear - baseYear;
                return processPyramidData(rawData, pyramidConfig, parseAge, ageShift);
            }, [areaPop, selectedZone, pyramidConfig, projectionYear, selectedViewYear, currentYearTH]);

                <div className="bg-white rounded-xl shadow-sm border p-4 lg:p-6 print-full-width">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-4 print:hidden">
                        <div><h2 className="text-xl font-bold text-gray-800">ข้อมูลประชากรเขตพื้นที่รับผิดชอบ</h2></div>
